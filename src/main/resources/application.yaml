ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.example.ApplicationKt.configure

database:
  jdbcUrl: "$POSTER_DB_JDBC_URL:jdbc:postgresql://localhost:5432/posterDb"
  driverClassName: "$POSTER_DB_DRIVER:org.postgresql.Driver"
  username: "$POSTER_DB_USERNAME:postgres"
  password: "$POSTER_DB_PASSWORD:postgres"
  maximumPoolSize: 10
  minimumIdle: 2

worker:
  # Интервалы и размеры пачек для фоновых процессов.
  outboxBatchSize: 25
  outboxDelayMs: 5000
  otpBatchSize: 25
  otpDelayMs: 5000
  imapDelayMs: 30000

mail:
  # defaults используются для пользовательской почты, если настройки не заданы в БД.
  defaults:
    smtpHost: "$?POSTER_SMTP_HOST"
    smtpPort: "$?POSTER_SMTP_PORT"
    imapHost: "$?POSTER_IMAP_HOST"
    imapPort: "$?POSTER_IMAP_PORT"
  auth:
    # Наша системная SMTP-почта для отправки OTP при регистрации.
    fromEmail: "$POSTER_AUTH_SMTP_FROM:"
    username: "$POSTER_AUTH_SMTP_USERNAME:"
    password: "$POSTER_AUTH_SMTP_PASSWORD:"
    smtpHost: "$POSTER_AUTH_SMTP_HOST:"
    smtpPort: "$POSTER_AUTH_SMTP_PORT:587"
